<body class=" dark:bg-[#00111c] transition-colors duration-700 ease-in-out">

<table class="table-auto w-64 text-gray-100 ">
 <thead class="border">

</thead>
<tbody>
  <tr>
    <td  class="border h-8 w-12 text-center">USD</td>
    <td class="border h-8 w-32 text-center"><input class="kursusd text-center w-16 bg-transparent" id="kursusd" value="15152"> </td>
    </tr>
    <tr>
    <td class="border h-8 w-12 text-center">SGD</td> 
    <td class="border h-8 w-32 text-center "><input class="kurssgd text-center w-16 bg-transparent" id="kurssgd" value="11364"> </td>
    </tr>
    <tr>
    <td class="border h-8 w-12 text-center ">HKD</td>
    <td class="border h-8 w-32 text-center "><input class="kurshkd text-center w-16 bg-transparent" id="kurshkd" value="1786"> </td>
   </tr>
    <tr>
    <td class="border h-8 w-12 text-center">EUR</td>
    <td class="border h-8 w-32 text-center "><input class="kurseur text-center w-16 bg-transparent" id="kurseur" value="17857"> </td>
    </tr>
    <tr>
    <td class="border h-8 w-12 text-center">JPY</td>
    <td class="border h-8 w-32 text-center "><input class="kursjpy text-center w-16 bg-transparent" id="kursjpy" value="100"> </td>
   </tr>
    <td class="border h-8 w-12 text-center">GBP</td>

   </tr>
    <tr>

    <td class="border h-8 w-32 text-center "><input class="kurssar text-center w-16 bg-transparent" id="kurssar" value="3546"> </td>
    </tr>
    <tr>
    <td class="border h-8 w-12 text-center">AUD</td>
    <td class="border h-8 w-32 text-center "><input class="kursaud text-center w-16 bg-transparent" id="kursaud" value="9091"> </td>
   </tr>
    <tr>
    <td class="border h-8 w-12 text-center">THB</td>
    <td class="border h-8 w-32 text-center "><input class="kursthb text-center w-16 bg-transparent"  id="kursthb" value="294"> </td>
    </tr>
    <tr>
    <td class="border h-8 w-12 text-center">MYR</td>
    <td class="border h-8 w-32 text-center "><input class="kursmyr text-center w-16 bg-transparent" id="kursmyr" value="3226"> </td>
    </tr>
    <tr>
    <td class="border h-8 w-12 text-center">CNY</td>
    <td class="border h-8 w-32 text-center "><input class="kurscny text-center w-16 bg-transparent" id="kurscny" value="1786"> </td>

    <td class="border h-8 w-12 text-center">IDR</td>

    </tr>
</tbody>

</div>


<div class="receipt-wrap grid justify-center items-center h-screen  transition-all duration-700" id="receiptWrap">
  <div class="receipt relative w-96 p-2 mt-10 rounded-xl bg-slate-100 text-slate-900 shadow-3xl dark:bg-[#001a2c] dark:shadow-black/50 transition-all duration-500"  id="receipt">
    
 <div class="absolute top-4 right-4 z-50 flex gap-1"> 

<!-- 🌙 DARK ICON -->
<svg fill="none" viewBox="0 0 24 24"
     class="dark size-7 cursor-pointer hidden hover:scale-110 transition dark:text-slate-100">
  <path stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
        d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75

 <h1 class="text-center text-2xl font-bold mt-4 dark:text-slate-100">VISA ON ARRIVAL </h1>
  <p class="text-center text-xl font-semibold mb-4 dark:text-slate-100">Molina Lite</p>
  

 <form class=" py-4 px-4">
<div class="grid grid-cols-8 gap-2 mb-4">
  <div class="col-span-2">
    <select class="Kurs border bg-transparent rounded-md h-10 w-full text-left font-bold text-sm p-2 dark:border-[#1ad3ff] dark:text-sky-500 dark:bg-[#011a2c] dark:focus:outline-none">
        <option value="usd">USD</option>
        <option value="sgd">SGD</option>
        <option value="hkd">HKD</option>
        <option value="eur">EUR</option>
        <option value="jpy">JPY</option>
        <option value="gbp">GBP</option>
        <option value="sar">SAR</option>
        <option value="aud">AUD</option>
        <option value="thb">THB</option>
        <option value="myr">MYR</option>
        <option value="cny">CNY</option>
        <option value="idr">IDR</option>
    </select>
  </div>
  
  <div class="col-span-4">
      <input class="form-control border bg-transparent px-[2px]  rounded-md w-full h-10 text-center truncate font-bold text-sm tracking-tight dark:border-[#1ad3ff] dark:text-sky-500 dark:bg-[#011a2c] dark:focus:outline-none" type="text" id="currency" value="US DOLLAR"  disabled readonly>
  </div>
  
  <div class="col-span-2">
      <input class="form-control border bg-transparent p-0 rounded-md w-full h-10 text-center items-center justify-center font-bold text-sm dark:border-[#1ad3ff] dark:text-sky-500 dark:bg-[#011a2c] dark:focus:outline-none" type="text" id="kurspilih" value="15152"  disabled readonly>
  </div>
</div>

<div class="form-floating mb-4">
  
  <div class="relative">
        <input type="number" id="orang" class="block px-2.5 pb-1.5 pt-3 w-full justify-center font-semibold  h-12 text-xl text-center bg-transparent rounded-md border border-gray-300  focus:outline-none focus:ring-0 focus:border-brand peer dark:border-[#1ad3ff] dark:text-sky-500 dark:bg-[#011a2c] dark:focus:outline-none" placeholder=" " />
        <label for="orang" class="absolute text-sm text-gray-600  rounded-full duration-300 transform -translate-y-3 scale-75 top-1 z-10 origin-[0] bg-slate-100 dark:bg-[#011a2c] dark:text-sky-400 px-2 peer-focus:px-2 peer-focus:text-fg-brand peer-placeholder-shown:scale-100 peer-placeholder-shown:-translate-y-1/2 peer-placeholder-shown:top-1/2 peer-focus:top-1 peer-focus:scale-75 peer-focus:-translate-y-3 start-1 rtl:peer-focus:translate-x-1/4 rtl:peer-focus:left-auto">Jumlah Passengers</label>
  </div>
</div>
        
<div class="grid grid-cols-2 gap-2 mb-4">
  <div class="relative">
        <input type="text" id="harga" class="block px-2.5 pb-1.5 pt-3 w-full font-semibold h-12 text-md text-center bg-transparent rounded-md border border-gray-300  focus:outline-none focus:ring-0 focus:border-brand peer dark:border-[#1ad3ff] dark:text-sky-500 dark:bg-[#011a2c] dark:focus:outline-none" placeholder=" " disabled readonly/>
        <label for="harga" class="absolute text-sm text-gray-600 rounded-full duration-300 transform -translate-y-3 scale-75 top-1 z-10 origin-[0] bg-slate-100 dark:bg-[#011a2c] dark:text-sky-400  px-2 peer-focus:px-2 peer-focus:text-fg-brand peer-placeholder-shown:scale-100 peer-placeholder-shown:-translate-y-1/2 peer-placeholder-shown:top-1/2 peer-focus:top-1 peer-focus:scale-75 peer-focus:-translate-y-3 start-1 rtl:peer-focus:translate-x-1/4 rtl:peer-focus:left-auto">Price</label>
  </div>
  <div class="relative">
        <input type="text" id="hargavalas" class="block px-2.5 pb-1.5 pt-3 w-full font-semibold h-12 text-md text-center bg-transparent rounded-md border border-gray-300  focus:outline-none focus:ring-0 focus:border-brand peer dark:border-[#1ad3ff] dark:text-sky-500 dark:bg-[#011a2c] dark:focus:outline-none" placeholder=" " disabled readonly/>     
  </div>
</div>

<div class="grid grid-cols-2 gap-2 mb-4">
  <div class="relative">
        <input type="text" id="bayar" class="block px-2.5 pb-1.5 pt-3 w-full font-semibold h-12 text-sm text-center bg-transparent rounded-md border border-gray-300 focus:outline-none focus:ring-0 focus:border-brand peer dark:border-[#1ad3ff] dark:text-sky-500 dark:bg-[#011a2c] dark:focus:outline-none" placeholder=" " />
        <label for="bayar" class="absolute text-sm text-gray-600 rounded-full duration-300 transform -translate-y-3 scale-75 top-1 z-10 origin-[0] bg-slate-100 dark:bg-[#011a2c] dark:text-sky-400  px-2 peer-focus:px-2 peer-focus:text-fg-brand peer-placeholder-shown:scale-100 peer-placeholder-shown:-translate-y-1/2 peer-placeholder-shown:top-1/2 peer-focus:top-1 peer-focus:scale-75 peer-focus:-translate-y-3 start-1 rtl:peer-focus:translate-x-1/4 rtl:peer-focus:left-auto">Payment</label>
  </div>
  <div class="relative">
        <input type="text" id="convert" class="block px-2.5 pb-1.5 pt-3 w-full font-semibold h-12 text-sm text-heading bg-transparent rounded-md border border-gray-300  focus:outline-none focus:ring-0 focus:border-brand peer dark:border-[#1ad3ff] dark:text-sky-500 dark:bg-[#011a2c] dark:focus:outline-none" placeholder=" "  disabled readonly />     
        <label for="convert" class="absolute text-sm text-gray-600 rounded-full duration-300 transform -translate-y-3 scale-75 top-1 z-10 origin-[0] bg-slate-100 dark:bg-[#011a2c] dark:text-sky-400  px-2 peer-focus:px-2 peer-focus:text-fg-brand peer-placeholder-shown:scale-100 peer-placeholder-shown:-translate-y-1/2 peer-placeholder-shown:top-1/2 peer-focus:top-1 peer-focus:scale-75 peer-focus:-translate-y-3 start-1 rtl:peer-focus:translate-x-1/4 rtl:peer-focus:left-auto">Convertion</label>
  </div>
</div>

<div class="form-floating mb-4">
  <div class="relative">
        <input type="text" id="round" class="block px-2.5 pb-1.5 pt-3 w-full font-semibold  h-12 text-sm text-center bg-transparent rounded-md border border-gray-300  focus:outline-none focus:ring-0 focus:border-brand peer dark:border-[#1ad3ff] dark:text-sky-500 dark:bg-[#011a2c] dark:focus:outline-none" placeholder=" "  disabled readonly/>
        <label for="round" class="absolute text-sm text-gray-600   rounded-full duration-300 transform -translate-y-3 scale-75 top-1 z-10 origin-[0] bg-slate-100 dark:bg-[#011a2c] dark:text-sky-400  px-2 peer-focus:px-2 peer-focus:text-fg-brand peer-placeholder-shown:scale-100 peer-placeholder-shown:-translate-y-1/2 peer-placeholder-shown:top-1/2 peer-focus:top-1 peer-focus:scale-75 peer-focus:-translate-y-3 start-1 rtl:peer-focus:translate-x-1/4 rtl:peer-focus:left-auto">Round</label>
  </div>
</div>
<div class="form-floating mb-4">
  <div class="relative">
        <input type="text" id="change" class="block px-2.5 pb-1.5 pt-3 w-full font-semibold  h-12 text-sm text-center bg-transparent rounded-md border border-gray-300  focus:outline-none focus:ring-0 focus:border-brand peer dark:border-[#1ad3ff] dark:text-sky-500 dark:bg-[#011a2c] dark:focus:outline-none" placeholder=" "  disabled readonly/>
        <label for="change" class="absolute text-sm text-gray-600 rounded-full duration-300 transform -translate-y-3 scale-75 top-1 z-10 origin-[0] bg-slate-100 dark:bg-[#011a2c] dark:text-sky-400 px-2 peer-focus:px-2 peer-focus:text-fg-brand peer-placeholder-shown:scale-100 peer-placeholder-shown:-translate-y-1/2 peer-placeholder-shown:top-1/2 peer-focus:top-1 peer-focus:scale-75 peer-focus:-translate-y-3 start-1 rtl:peer-focus:translate-x-1/4 rtl:peer-focus:left-auto">Change</label>
  </div>
</div>
      <button type="button" class="btn font-semibold bg-[#0353a4] w-full h-10 mt-4 rounded-full text-slate-100 hover:bg-[#061a40] transition-colors duration-500 hover:text-white dark:bg-sky-400 dark:hover:bg-sky-200 dark:text-sky-950 dark:hover:text-sky-950" onclick="printReceipt()">Print Receipt</button>
      
    </form>
    
    
   
    </div>
    <div class="btnedit flex mx-auto">
  <button id="edit" class="btn bg-red-600 w-32 h-10 rounded-full text-slate-100 hover:bg-sky-900 hover:text-white">Edit Kurs</button>
</div>
  </div>
